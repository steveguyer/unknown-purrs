<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Unknown Purrs Audio Experience</title>
    <link rel="stylesheet" type="text/css" href="style.css?v=paw-play" />
    <script>
      document.documentElement.setAttribute(
        "data-theme",
        localStorage.getItem("unknown-pleasures-theme") || "dark"
      );
    </script>

    <meta name="description" content="Unknown Purrs Audio Experience" />
    <meta property="og:title" content="Unknown Purrs Audio Experience" />
    <meta property="og:description" content="Unknown Purrs Audio Experience" />
    <meta property="og:type" content="article" />
    <meta property="og:url" content="https://steveguyer.github.io/unknown-purrs" />
    <meta property="og:image" content="https://kottke.org/plus/misc/images/joy-division-unknown-pleasures.jpg" />
</head>

<body>
    <div id="p5_loading">
        <div class="container">
            <div class="waveLoader">
                <span class="line"></span>
                <span class="line"></span>
                <span class="line"></span>
                <span class="line"></span>
                <span class="line"></span>
                <span class="line"></span>
                <span class="line"></span>
                <span class="line"></span>
                <span class="line"></span>
                <span class="line"></span>
                <span class="line"></span>
                <span class="line"></span>
                <span class="line"></span>
                <span class="line"></span>
                <span class="line"></span>
                <span class="line"></span>
                <span class="line"></span>
                <span class="line"></span>
                <span class="line"></span>
                <span class="line"></span>
            </div>
            <p id="loader_text">
                LOADING
            </p>
        </div>
    </div>

    <div id="main-content-container">
        <div id="buttons-container"></div>
        <div id="canvas-container"></div>
        <button id="play-button" type="button" aria-label="Play">
            <svg class="paw" viewBox="0 0 64 64" aria-hidden="true">
                <ellipse cx="32" cy="45" rx="14" ry="12" />
                <ellipse cx="13" cy="29" rx="6" ry="8" transform="rotate(-25 13 29)" />
                <ellipse cx="25" cy="16" rx="6" ry="8" transform="rotate(-8 25 16)" />
                <ellipse cx="39" cy="16" rx="6" ry="8" transform="rotate(8 39 16)" />
                <ellipse cx="51" cy="29" rx="6" ry="8" transform="rotate(25 51 29)" />
            </svg>
            <span id="play-label">play</span>
        </button>
    </div>

    <footer>(c) 2026&nbsp;&nbsp;beats by peeves</footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/0.9.0/p5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/0.9.0/addons/p5.dom.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/0.9.0/addons/p5.sound.min.js"></script>
    <script src="constants.js?v=title-orange"></script>
    <script src="script.js?v=paw-play"></script>
</body>

</html>
